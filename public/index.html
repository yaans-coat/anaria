<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Anaria</title>
		<link rel="stylesheet" href="/styles.css" />
		<link rel="stylesheet" href="/css/themes.css" />
		<script src="/js/theme-boot.js"></script>
		<meta name="robots" content="noindex" />
	</head>

	<body>
		<nav class="dock" aria-label="dock">
			<div class="dock__group">
				<button
					class="dock__btn"
					data-open="anaria://home"
					data-page="home"
					type="button"
					title="home"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3l9-8z"
						/>
					</svg>
					<span>home</span>
				</button>
				<button
					class="dock__btn"
					data-open="anaria://games"
					data-page="games"
					type="button"
					title="games"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M7 8h10a5 5 0 0 1 5 5v1a4 4 0 0 1-7.2 2.4L14 15h-4l-.8 1.4A4 4 0 0 1 2 14v-1a5 5 0 0 1 5-5zM7.5 11v1.5H6V14h1.5v1.5H9V14h1.5v-1.5H9V11H7.5zm8 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2 2.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"
						/>
					</svg>
					<span>games</span>
				</button>
				<button
					class="dock__btn"
					data-open="anaria://movies"
					data-page="movies"
					type="button"
					title="movies"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							fill-rule="evenodd"
							d="M9.4 4.6l-.9 1.6A2 2 0 0 0 6.8 7.3H4.5A2.5 2.5 0 0 0 2 9.8v8.7A2.5 2.5 0 0 0 4.5 21h15a2.5 2.5 0 0 0 2.5-2.5V9.8a2.5 2.5 0 0 0-2.5-2.5h-2.3a2 2 0 0 0-1.7-1.1l-.9-1.6H9.4zM12 9.6a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 0 1 0-8.4zm-7.5 1.6a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"
						/>
					</svg>
					<span>movies</span>
				</button>
				<button
					class="dock__btn"
					data-open="anaria://music"
					data-page="music"
					type="button"
					title="music"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M20 3v12.5a3.5 3.5 0 1 1-2-3.16V7.5L10 9.3v8.2a3.5 3.5 0 1 1-2-3.16V6.2L20 3z"
						/>
					</svg>
					<span>music</span>
				</button>
				<button
					class="dock__btn"
					data-open="anaria://chat"
					data-page="chat"
					type="button"
					title="chat"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1zm3 4v2h10V8H7zm0 4v2h7v-2H7z"
						/>
					</svg>
					<span>chat</span>
				</button>
				<button
					class="dock__btn"
					data-open="anaria://ai"
					data-page="ai"
					type="button"
					title="ai"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							fill-rule="evenodd"
							d="M12 2.2a1.8 1.8 0 0 1 1.8 1.8v1.3h2.7A3.2 3.2 0 0 1 19.7 8.5v1.8h.6A1.7 1.7 0 0 1 22 12v5.5a3.2 3.2 0 0 1-3.2 3.2H5.2A3.2 3.2 0 0 1 2 17.5V12a1.7 1.7 0 0 1 1.7-1.7h.6V8.5a3.2 3.2 0 0 1 3.2-3.2h2.7V4A1.8 1.8 0 0 1 12 2.2zM8.4 10.9a1.9 1.9 0 0 0-1.9 1.9v1.8a1.9 1.9 0 0 0 3.8 0v-1.8a1.9 1.9 0 0 0-1.9-1.9zm7.2 0a1.9 1.9 0 0 0-1.9 1.9v1.8a1.9 1.9 0 0 0 3.8 0v-1.8a1.9 1.9 0 0 0-1.9-1.9zM7.8 17.2h8.4v1.7H7.8z"
						/>
					</svg>
					<span>ai</span>
				</button>
			</div>

			<div class="dock__sep" role="separator"></div>

			<div class="dock__group">
				<button
					class="dock__btn"
					data-open="anaria://tos"
					data-page="tos"
					type="button"
					title="tos"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M6 2h9l5 5v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm8 1.5V8h4.5L14 3.5zM8 12h8v1.6H8V12zm0 4h8v1.6H8V16z"
						/>
					</svg>
					<span>tos</span>
				</button>
				<button
					class="dock__btn"
					data-open="anaria://p"
					data-page="p"
					type="button"
					title="policy"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5l8-3zm0 2.2L6 6.4v4.6c0 4 2.6 7.4 6 8.9 3.4-1.5 6-4.9 6-8.9V6.4l-6-2.2zM11 10h2v5h-2v-5zm0-3h2v2h-2V7z"
						/>
					</svg>
					<span>policy</span>
				</button>
				<button
					class="dock__btn"
					data-open="anaria://dmca"
					data-page="dmca"
					type="button"
					title="dmca"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M12 2l9 4v6c0 5.3-3.8 9.8-9 11-5.2-1.2-9-5.7-9-11V6l9-4zm0 2.2L5 7.2v4.8c0 4.2 2.9 7.9 7 9 4.1-1.1 7-4.8 7-9V7.2l-7-3zM8.5 8.5L12 12l3.5-3.5 1.4 1.4L13.4 13l3.5 3.5-1.4 1.4L12 14.4l-3.5 3.5-1.4-1.4L10.6 13l-3.5-3.5 1.4-1.4z"
						/>
					</svg>
					<span>dmca</span>
				</button>
			</div>

			<div class="dock__sep" role="separator"></div>

			<div class="dock__group">
				<button
					class="dock__btn"
					data-open="anaria://cloudsync"
					data-page="cloudsync"
					type="button"
					title="cloudsync"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M6.5 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.7 8.2 4 4 0 0 1 17.5 18H6.5zM12 9.5v3.2l2.6 1.5-1 1.7L10.7 14V9.5H12z"
						/>
					</svg>
					<span>cloudsync</span>
				</button>
				<button
					class="dock__btn"
					data-settings
					data-page="settings"
					type="button"
					title="settings"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.9 3.5c0-.5-.05-1-.14-1.47l2-1.55-2-3.46-2.35 1a7.6 7.6 0 0 0-2.55-1.47L15.35 2h-4l-.41 2.55a7.6 7.6 0 0 0-2.55 1.47l-2.35-1-2 3.46 2 1.55a7.7 7.7 0 0 0 0 2.94l-2 1.55 2 3.46 2.35-1a7.6 7.6 0 0 0 2.55 1.47L11.35 22h4l.41-2.55a7.6 7.6 0 0 0 2.55-1.47l2.35 1 2-3.46-2-1.55c.09-.47.14-.96.14-1.47z"
						/>
					</svg>
					<span>settings</span>
				</button>
			</div>
		</nav>

<div class="url-bar">
			<button id="back" type="button" aria-label="back" title="back">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.4 12l5.3 5.3a1 1 0 0 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0z" />
				</svg>
			</button>
			<button
				id="forward"
				type="button"
				aria-label="forward"
				title="forward"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M9.3 5.3a1 1 0 0 0 0 1.4L14.6 12l-5.3 5.3a1 1 0 0 0 1.4 1.4l6-6a1 1 0 0 0 0-1.4l-6-6a1 1 0 0 0-1.4 0z" />
				</svg>
			</button>
			<form id="omnibox" class="omnibox" role="search">
				<input
					id="address"
					type="text"
					name="address"
					placeholder="search or enter address"
					autocomplete="off"
					autocapitalize="off"
					spellcheck="false"
					enterkeyhint="go"
					aria-label="Address"
				/>
			</form>
			<button
				id="reload"
				type="button"
				aria-label="reload"
				title="reload"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M12 4a8 8 0 1 0 7.7 10h-2.1A6 6 0 1 1 12 6c1.7 0 3.1.6 4.2 1.6L13 11h7V4l-2.4 2.4A7.9 7.9 0 0 0 12 4z" />
				</svg>
			</button>
			<button
				id="home"
				type="button"
				aria-label="home"
				title="home"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2.4c1.6 0 3.7 3.6 4.3 9.2-.7.5-2.5 6.6-4.3 6.6s-3.6-6.1-4.3-6.6C8.3 8 10.4 4.4 12 4.4zM4.3 10.9c1.4-.5 4.6.7 6.7 2.6-.9 3-1.9 5.5-2.7 6.5A8.6 8.6 0 0 1 4.3 10.9zm15.4 0a8.6 8.6 0 0 1-3.9 9.1c-.8-1-1.8-3.5-2.7-6.5 2.1-1.9 5.3-3.1 6.7-2.6z" />
				</svg>
			</button>
			<button
				id="bookmark"
				type="button"
				aria-pressed="false"
				aria-label="bookmark"
				title="bookmark"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2l-6.1 3.4 1.4-6.8L2.2 9.1l6.9-.8L12 2z" />
				</svg>
			</button>
			<button
				id="settings-toggle"
				type="button"
				aria-label="settings"
				title="settings"
				aria-expanded="false"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path
						d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.9 3.5c0-.5-.05-1-.14-1.47l2-1.55-2-3.46-2.35 1a7.6 7.6 0 0 0-2.55-1.47L15.35 2h-4l-.41 2.55a7.6 7.6 0 0 0-2.55 1.47l-2.35-1-2 3.46 2 1.55a7.7 7.7 0 0 0 0 2.94l-2 1.55 2 3.46 2.35-1a7.6 7.6 0 0 0 2.55 1.47L11.35 22h4l.41-2.55a7.6 7.6 0 0 0 2.55-1.47l2.35 1 2-3.46-2-1.55c.09-.47.14-.96.14-1.47z"
					/>
				</svg>
			</button>
		</div>
		<p id="status" class="status" role="status" hidden></p>

		<main id="frames" class="frames"></main>

		<script type="module" src="/js/app.js"></script>
	</body>
</html>
